name: Refresh gamma wall
on:
  schedule:
    - cron: "5,35 13-21 * * 1-5"   # UTC; the script skips runs outside 9:25-16:15 ET
  push:
    paths: ["tickers.txt"]   # adding a ticker fetches it right away
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside market hours"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch chain from Public
        env:
          PUBLIC_API_SECRET: ${{ secrets.PUBLIC_API_SECRET }}
          PUBLIC_ACCOUNT_ID: ${{ secrets.PUBLIC_ACCOUNT_ID }}
          FORCE: ${{ (inputs.force || github.event_name == 'push') && '1' || '0' }}
        run: python3 scripts/refresh.py
      - name: Commit data
        run: |
          git config user.name "gamma-wall-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Refresh chains $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
